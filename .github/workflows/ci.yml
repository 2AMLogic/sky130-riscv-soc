name: CI

# What this workflow runs is the step names below. The one complete inventory, with the local legs beside it, is
# verification/README.md, section "What CI runs, and what stays local" — keep it, not this header, in step with the
# steps. What the steps do not say:
# - No path filters; a started main run is never cancelled (.loom/docs/ci-principles.md).
# - Runs on pull requests, the merge queue (merge_group) and main. Each queue
#   entry gets its own concurrency group keyed on its head SHA, so a queued
#   entry is never superseded while pending and a started run is never cancelled.
# - No RISC-V compiler in CI: the boot and firmware tests simulate the checked-in firmware/boot and
#   firmware/soc hex images as they are.
# - PDK-heavy legs (synthesis, place-and-route, DRC, LVS) stay local.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('ci-mq-{0}', github.event.merge_group.head_sha) || 'ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator and Icarus Verilog (the CVE2 convert smoke test elaborates with iverilog)
        run: sudo apt-get update && sudo apt-get install -y verilator iverilog
      - name: Record linter, fixture tests, the pinned-import fetcher and the check-script exit codes
        run: |
          python3 -I verification/tools/lint_records.py
          python3 -I verification/tools/tests/test_lint_records.py
          verification/tools/tests/test_fetch_cve2.sh
          verification/tools/tests/test_lint_rtl.sh
          verification/tools/tests/test_setup_env_check.sh
          python3 -I verification/tools/tests/test_archtest_manifest.py
      - name: Workflow triggers satisfy the merge-queue contract
        run: |
          python3 -I verification/tools/check_workflow_triggers.py
          python3 -I verification/tools/tests/test_check_workflow_triggers.py
      - name: Spec row projections match spec/soc.md
        run: |
          python3 -I verification/tools/check_soc_rows.py
          python3 -I verification/tools/tests/test_check_soc_rows.py
      - name: SRAM stand-in matches the pinned macro model
        run: |
          scripts/fetch-sram-macro.sh
          python3 -I verification/tools/check_sram_standin.py
          python3 -I verification/tools/tests/test_check_sram_standin.py
      - name: Install sv2v at the pin and convert the CVE2 core
        uses: ./.github/actions/cve2-core
      - name: RTL lint (soc_top.sv included; a missing core fails)
        run: LINT_REQUIRE_CORE=1 verification/tools/lint_rtl.sh

  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install cocotb at the pinned version
        run: |
          pin="$(sed -n 's/^PIN_COCOTB="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          test -n "$pin"
          python3 -m venv .venv
          .venv/bin/pip install "cocotb==${pin}"
      - name: cocotb xbar and reset-synchroniser tests
        run: |
          . .venv/bin/activate
          make -C verification xbar
      - name: cocotb peripheral tests (UART, GPIO, timer, window decode)
        run: |
          . .venv/bin/activate
          make -C verification periph
      - name: Install sv2v at the pin and convert the CVE2 core
        uses: ./.github/actions/cve2-core
      - name: cocotb SoC boot test
        run: |
          . .venv/bin/activate
          make -C verification boot
      - name: cocotb SoC firmware tests (banner, echo, GPIO, timer interrupt)
        run: |
          . .venv/bin/activate
          make -C verification soc
          make -C verification soc-negative
