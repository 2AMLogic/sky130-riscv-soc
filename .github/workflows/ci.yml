name: CI

# Records lint, RTL lint (soc_top.sv included, against the converted CVE2 core) and the cocotb xbar, reset-synchroniser,
# peripheral and SoC boot tests. The core is fetched (hash-verified) and converted with sv2v at the pin in
# scripts/setup-env.sh on every run; the converted output is never checked in. PDK-heavy legs (synthesis,
# place-and-route, DRC, LVS) stay local: see verification/README.md.
# No path filters; a started main run is never cancelled (.loom/docs/ci-principles.md).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator and Icarus Verilog (the CVE2 convert smoke test elaborates with iverilog)
        run: sudo apt-get update && sudo apt-get install -y verilator iverilog
      - name: Record linter and fixture test
        run: |
          python3 -I verification/tools/lint_records.py
          python3 -I verification/tools/tests/test_lint_records.py
      - name: Spec row projections match spec/soc.md
        run: |
          python3 -I verification/tools/check_soc_rows.py
          python3 -I verification/tools/tests/test_check_soc_rows.py
      - name: Install sv2v at the pinned version
        run: |
          pin="$(sed -n 's/^PIN_SV2V="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          sha="$(sed -n 's/^PIN_SV2V_SHA256="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          test -n "$pin" && test -n "$sha"
          d="$(mktemp -d)"
          curl -fsSL --retry 2 -o "$d/sv2v.zip" "https://github.com/zachjs/sv2v/releases/download/${pin}/sv2v-Linux.zip"
          echo "${sha}  $d/sv2v.zip" | sha256sum -c -
          unzip -q "$d/sv2v.zip" -d "$d"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$d/sv2v-Linux/sv2v" "$HOME/.local/bin/sv2v"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch and convert the pinned CVE2 core
        run: |
          scripts/fetch-cve2.sh
          scripts/convert-cve2.sh
      - name: RTL lint (soc_top.sv included; a missing core fails)
        run: LINT_REQUIRE_CORE=1 verification/tools/lint_rtl.sh

  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install cocotb at the pinned version
        run: |
          pin="$(sed -n 's/^PIN_COCOTB="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          test -n "$pin"
          python3 -m venv .venv
          .venv/bin/pip install "cocotb==${pin}"
      - name: cocotb xbar and reset-synchroniser tests
        run: |
          . .venv/bin/activate
          make -C verification xbar
      - name: cocotb peripheral tests (UART, GPIO, timer, window decode)
        run: |
          . .venv/bin/activate
          make -C verification periph
      - name: Install sv2v at the pinned version
        run: |
          pin="$(sed -n 's/^PIN_SV2V="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          sha="$(sed -n 's/^PIN_SV2V_SHA256="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          test -n "$pin" && test -n "$sha"
          d="$(mktemp -d)"
          curl -fsSL --retry 2 -o "$d/sv2v.zip" "https://github.com/zachjs/sv2v/releases/download/${pin}/sv2v-Linux.zip"
          echo "${sha}  $d/sv2v.zip" | sha256sum -c -
          unzip -q "$d/sv2v.zip" -d "$d"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$d/sv2v-Linux/sv2v" "$HOME/.local/bin/sv2v"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch and convert the pinned CVE2 core
        run: |
          scripts/fetch-cve2.sh
          scripts/convert-cve2.sh
      - name: cocotb SoC boot test (default and single-port I-SRAM configurations)
        run: |
          . .venv/bin/activate
          make -C verification boot
          make -C verification boot-1rw
