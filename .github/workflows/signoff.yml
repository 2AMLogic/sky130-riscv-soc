name: signoff

# Re-grades the block manifest with the pinned klt and fails on drift from the
# committed report. The klt pin lives only in scripts/setup-env.sh (PIN_KLT_SHA).
# No path filters; a started main run is never cancelled (.loom/docs/ci-principles.md).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('signoff-pr-{0}', github.event.pull_request.number) || 'signoff-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the klt pin
        run: |
          sha="$(sed -n 's/^PIN_KLT_SHA="\([0-9a-f]\{40\}\)".*/\1/p' scripts/setup-env.sh)"
          test "${#sha}" -eq 40
          echo "KLT_SHA=${sha}" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
      - name: Grade the manifest against the committed report
        run: |
          # --check: exit 0 = report reproduces; 3 = drift (a failure here).
          uvx --from "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@${KLT_SHA}" \
            klt signoff --manifest manifests/sky130-riscv-soc.json \
            --check manifests/sky130-riscv-soc.signoff.json
      - name: Re-attest item 9 (testbenches shipped)
        run: |
          # Every file/hash check and the pins re-run; the cold_start is local_only (it needs
          # cocotb, sv2v and the converted CVE2), so it is carried from the committed
          # envelope and shown as [SKIP]. klt only checks what the inventory lists, so the
          # next step catches a bench that is on disk but missing from it.
          uvx --from "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@${KLT_SHA}" \
            klt signoff --attest 9 \
            --inventory manifests/sky130-riscv-soc.attest9.inventory.json \
            --check manifests/sky130-riscv-soc.attest9.json
      - name: Every bench under verification/tests is in the item-9 inventory
        run: |
          python3 -I - <<'PY'
          import json, pathlib, sys
          inv = json.load(open("manifests/sky130-riscv-soc.attest9.inventory.json"))
          listed = set(inv["testbenches"])
          found = {p.as_posix() for p in pathlib.Path("verification/tests").rglob("test_*.py")}
          missing = sorted(found - listed)
          if missing:
              sys.exit("benches missing from the item-9 inventory: " + ", ".join(missing))
          print("inventory lists all", len(found), "benches")
          PY
